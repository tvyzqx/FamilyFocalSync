project_id = "familyfocal"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[realtime]
enabled = true

[auth]
# Public URL of the sync server. Override per environment via the
# corresponding `.env` value if you self-host on a different domain.
site_url = "https://sync.example.com"

# Required so Supabase Auth accepts redirects back into the app.
# - familyfocal://join  — QR-onboarding deep link (existing).
# - familyfocal://claim — magic-link claim deep link (Phase 5).
# Without these entries Supabase rejects the redirect and the magic-link
# flow fails with `redirect_to is not allowed`.
additional_redirect_urls = ["familyfocal://join", "familyfocal://claim"]

[functions]
verify_jwt = true

# Parent must be authenticated to issue a token for a profile in their
# family — gated by JWT.
[functions.generate-join-token]
verify_jwt = true

# Parent polls to see whether a token they issued has been claimed —
# gated by JWT.
[functions.check-join-status]
verify_jwt = true

# Receiver redeems a token before they have a session, so this endpoint
# must accept anonymous calls (Anon Key only).
[functions.join-family]
verify_jwt = false

# First-time signup — caller has no session yet. Anonymous, but the
# Anon Key is still required at the Kong layer.
[functions.bootstrap-family]
verify_jwt = false

# Parent revokes all sessions of a target profile (other parent, kid).
# Caller must be authenticated; the function double-checks parent role
# inside the body.
[functions.revoke-user-sessions]
verify_jwt = true

# Push relay / FCM sender. Called by servers (cloud's or self-host's
# notify-task-assigned), authenticated by PUSH_RELAY_KEY in the body's
# Authorization header — not a user session.
[functions.send-notification]
verify_jwt = false

# Database-webhook target on tasks INSERT. Called by Postgres, authenticated
# by PUSH_WEBHOOK_SECRET — not a user session.
[functions.notify-task-assigned]
verify_jwt = false
