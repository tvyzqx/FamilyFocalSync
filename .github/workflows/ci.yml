name: ci

on:
  push:
  pull_request:

jobs:
  migration-guard:
    name: Additive-only migration guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check migrations are additive-only and RLS-covered
        run: python3 scripts/check_migrations.py
